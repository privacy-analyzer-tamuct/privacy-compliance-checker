name: Quarterly Policy Refresh

on:
  schedule:
    # Runs at 00:00 UTC on the first day of every 3rd month:
    # January, April, July, October
    - cron: "0 0 1 */3 *"

  # Allows you to manually run the job from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quarterly policy refresh
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          python step5_biannual_refresh.py --run

      - name: Commit updated knowledge graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/knowledge_graph_n8259a/inferred_merged.rdf

          if git diff --cached --quiet; then
            echo "No knowledge graph changes to commit."
          else
            git commit -m "Automated quarterly policy refresh"
            git push
          fi
